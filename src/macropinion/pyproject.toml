[project]
name = "macropinion"
version = "0.1.0"
description = "Personal macro dashboard: ingestion, store and models"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropinion"]

[tool.ruff]
line-length = 100
